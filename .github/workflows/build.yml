name: Build CV

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly refresh of citations and GitHub statistics (Monday 06:00 UTC).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

# Paperpile Bot can push several commits in a row; only the newest build matters.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tectonic cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('cv.tex', 'cv-short.tex', 'resume.cls', 'texmf/**') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      # The tectonic bundle ships biblatex 3.17, which needs biber 2.17 exactly.
      - name: Setup Tectonic and Biber
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0
          biber-version: "2.17"

      # Live GitHub/PyPI numbers for the Research Software section.
      # On failure the script keeps the committed software_stats.tex.
      - name: Update software and publication statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/github_stats.py
          python3 scripts/pub_stats.py

      - name: Build PDF
        run: |
          # fontawesome6 is not in the tectonic bundle; it is vendored in texmf/
          tectonic -X compile -Z search-path=texmf/fontawesome6 --keep-logs cv.tex
          tectonic -X compile -Z search-path=texmf/fontawesome6 --keep-logs cv-short.tex

      # tectonic exits 0 even when a glyph is missing from the font
      - name: Check for missing glyphs
        run: |
          if grep -h 'Missing character' cv.log cv-short.log; then
            echo "::error::Some characters are missing from the font (see above)"
            exit 1
          fi

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv.pdf
            cv-short.pdf
            cv.log
            cv-short.log

      # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
      - name: Commit updated PDFs and statistics to master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf cv-short.pdf software_stats.tex pub_stats.tex
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Update CV PDFs and statistics [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
